! ============================================================
! Access Switch B – FINANCE Department
! Device   : SW-B (Cisco Catalyst 2960)
! VLAN     : 20 (FINANCE)
! Project  : VLAN Configuration and Management
! ============================================================

enable
configure terminal

hostname SW-B-Finance
no ip domain-lookup
enable secret cisco123
service password-encryption

line console 0
 password cisco
 login
 logging synchronous
line vty 0 15
 password cisco
 login
 transport input ssh telnet

! ============================================================
! STEP 1: VLANs
! ============================================================
vlan 20
 name FINANCE
vlan 40
 name MANAGEMENT
vlan 99
 name NATIVE
vlan 999
 name UNUSED_PORTS

! ============================================================
! STEP 2: VTP Client
! ============================================================
vtp mode client
vtp domain COMPANY-NET
vtp password vtp_secret_2025
vtp version 2

! ============================================================
! STEP 3: Management SVI
! ============================================================
interface vlan 40
 description Management-Access
 ip address 192.168.0.11 255.255.255.0
 no shutdown

ip default-gateway 192.168.0.1

! ============================================================
! STEP 4: Trunk Uplink to Core Switch
! ============================================================
interface GigabitEthernet0/1
 description Trunk-to-Core-SW
 switchport mode trunk
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 20,40,99
 switchport nonegotiate
 no shutdown

! ============================================================
! STEP 5: Finance Workstations (Fa0/1–Fa0/10)
!         Finance is sensitive — strict port security (max 1 MAC)
! ============================================================
interface range FastEthernet0/1 - 10
 description Finance-Workstation
 switchport mode access
 switchport access vlan 20
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 no shutdown

! ============================================================
! STEP 6: Finance Servers (Fa0/11–Fa0/14)
! ============================================================
interface range FastEthernet0/11 - 14
 description Finance-Server
 switchport mode access
 switchport access vlan 20
 switchport nonegotiate
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 no shutdown

! ============================================================
! STEP 7: Unused Ports
! ============================================================
interface range FastEthernet0/15 - 24
 description UNUSED-DISABLED
 switchport mode access
 switchport access vlan 999
 shutdown

spanning-tree mode rapid-pvst
spanning-tree vlan 20 priority 8192

end
write memory
