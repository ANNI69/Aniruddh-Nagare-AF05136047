! ============================================================
! Access Switch A – SALES Department
! Device   : SW-A (Cisco Catalyst 2960)
! VLAN     : 10 (SALES)
! Project  : VLAN Configuration and Management
! ============================================================

enable
configure terminal

hostname SW-A-Sales
no ip domain-lookup
enable secret cisco123
service password-encryption

! --- Console & VTY ---
line console 0
 password cisco
 login
 logging synchronous
line vty 0 15
 password cisco
 login
 transport input ssh telnet

! ============================================================
! STEP 1: Create VLANs (client receives from VTP server,
!         but define locally as fallback)
! ============================================================
vlan 10
 name SALES
vlan 40
 name MANAGEMENT
vlan 99
 name NATIVE
vlan 999
 name UNUSED_PORTS

! ============================================================
! STEP 2: VTP Client Mode
! ============================================================
vtp mode client
vtp domain COMPANY-NET
vtp password vtp_secret_2025
vtp version 2

! ============================================================
! STEP 3: Management SVI
! ============================================================
interface vlan 40
 description Management-Access
 ip address 192.168.0.10 255.255.255.0
 no shutdown

ip default-gateway 192.168.0.1

! ============================================================
! STEP 4: Uplink Trunk to Core Switch (Gi0/1)
! ============================================================
interface GigabitEthernet0/1
 description Trunk-to-Core-SW
 switchport mode trunk
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,40,99
 switchport nonegotiate
 no shutdown

! ============================================================
! STEP 5: Access Ports – Sales Workstations (Fa0/1–Fa0/12)
! ============================================================
interface range FastEthernet0/1 - 12
 description Sales-Workstation
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 ! Port Security
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation shutdown
 no shutdown

! ============================================================
! STEP 6: Access Ports – Sales Printers (Fa0/13–Fa0/16)
! ============================================================
interface range FastEthernet0/13 - 16
 description Sales-Printer
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 spanning-tree portfast
 ! Allow up to 2 MACs for printers (NIC + embedded card)
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown

! ============================================================
! STEP 7: Unused Ports – Security hardening
! ============================================================
interface range FastEthernet0/17 - 24
 description UNUSED-DISABLED
 switchport mode access
 switchport access vlan 999
 shutdown

! ============================================================
! STEP 8: Spanning Tree
! ============================================================
spanning-tree mode rapid-pvst
spanning-tree vlan 10 priority 8192

end
write memory

! ============================================================
! VERIFICATION COMMANDS
! ============================================================
! show vlan brief
! show interfaces trunk
! show port-security interface fa0/1
! show port-security address
! show vtp status
