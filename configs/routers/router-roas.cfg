! ============================================================
! Router-on-a-Stick (ROAS) Configuration
! Device   : Router0 (Cisco ISR 2901 / 4321)
! Purpose  : Inter-VLAN routing via 802.1Q sub-interfaces
! Project  : VLAN Configuration and Management
! ============================================================
!
! Topology:
!   Fa0/0 ──── (Trunk) ──── Core-SW (Gi0/1)
!   Fa0/1 ──── WAN / Internet
!
! ============================================================

enable
configure terminal

hostname Router0
no ip domain-lookup
enable secret cisco123
service password-encryption

line console 0
 password cisco
 login
 logging synchronous
line vty 0 4
 password cisco
 login
 transport input ssh telnet

! ============================================================
! STEP 1: Physical Interface (must be UP with no IP)
!         The sub-interfaces carry the actual VLAN traffic
! ============================================================
interface FastEthernet0/0
 description Trunk-Link-to-Core-SW
 no ip address
 duplex auto
 speed auto
 no shutdown

! ============================================================
! STEP 2: Sub-interfaces – one per VLAN
!         Each sub-interface is tagged with a VLAN ID
!         and assigned the gateway IP for that VLAN
! ============================================================

! Sub-interface for VLAN 10 – Sales
interface FastEthernet0/0.10
 description Gateway-VLAN10-SALES
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 ip access-group SALES-OUT out
 no shutdown

! Sub-interface for VLAN 20 – Finance
interface FastEthernet0/0.20
 description Gateway-VLAN20-FINANCE
 encapsulation dot1Q 20
 ip address 10.20.20.1 255.255.255.0
 ip access-group FINANCE-OUT out
 no shutdown

! Sub-interface for VLAN 30 – IT
interface FastEthernet0/0.30
 description Gateway-VLAN30-IT
 encapsulation dot1Q 30
 ip address 10.30.30.1 255.255.255.0
 no shutdown

! Sub-interface for VLAN 40 – Management
interface FastEthernet0/0.40
 description Gateway-VLAN40-MGMT
 encapsulation dot1Q 40
 ip address 192.168.0.1 255.255.255.0
 no shutdown

! Native VLAN (untagged)
interface FastEthernet0/0.99
 description Native-VLAN
 encapsulation dot1Q 99 native
 no shutdown

! ============================================================
! STEP 3: WAN Interface (simulated internet)
! ============================================================
interface FastEthernet0/1
 description WAN-Interface
 ip address dhcp
 ip nat outside
 no shutdown

! ============================================================
! STEP 4: NAT – PAT (overload) for all VLANs to reach internet
! ============================================================
ip nat inside source list NAT-TRAFFIC interface FastEthernet0/1 overload

interface FastEthernet0/0.10
 ip nat inside
interface FastEthernet0/0.20
 ip nat inside
interface FastEthernet0/0.30
 ip nat inside

ip access-list standard NAT-TRAFFIC
 permit 10.10.10.0 0.0.0.255
 permit 10.20.20.0 0.0.0.255
 permit 10.30.30.0 0.0.0.255

! ============================================================
! STEP 5: Extended ACLs for Inter-VLAN Filtering
!
!  Policy:
!    SALES  (10) ─X─> FINANCE (20)  [blocked]
!    FINANCE(20) ─X─> SALES   (10)  [blocked]
!    IT     (30) ─→   ALL           [permitted]
! ============================================================

ip access-list extended SALES-OUT
 remark Block Sales to Finance
 deny   ip 10.10.10.0 0.0.0.255 10.20.20.0 0.0.0.255
 remark Allow everything else
 permit ip any any

ip access-list extended FINANCE-OUT
 remark Block Finance to Sales
 deny   ip 10.20.20.0 0.0.0.255 10.10.10.0 0.0.0.255
 remark Allow everything else
 permit ip any any

! ============================================================
! STEP 6: Default Route
! ============================================================
ip route 0.0.0.0 0.0.0.0 FastEthernet0/1

! ============================================================
! STEP 7: DHCP Pools (optional – router acts as DHCP server)
! ============================================================
ip dhcp excluded-address 10.10.10.1 10.10.10.10
ip dhcp excluded-address 10.20.20.1 10.20.20.10
ip dhcp excluded-address 10.30.30.1 10.30.30.10

ip dhcp pool SALES-POOL
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
 dns-server 8.8.8.8 8.8.4.4
 domain-name sales.company.local
 lease 1

ip dhcp pool FINANCE-POOL
 network 10.20.20.0 255.255.255.0
 default-router 10.20.20.1
 dns-server 8.8.8.8 8.8.4.4
 domain-name finance.company.local
 lease 1

ip dhcp pool IT-POOL
 network 10.30.30.0 255.255.255.0
 default-router 10.30.30.1
 dns-server 8.8.8.8 8.8.4.4
 domain-name it.company.local
 lease 1

end
write memory

! ============================================================
! VERIFICATION COMMANDS
! ============================================================
! show ip interface brief
! show interfaces fa0/0.10
! show ip route
! show ip nat translations
! show ip dhcp binding
! show access-lists
