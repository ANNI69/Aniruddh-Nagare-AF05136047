! ============================================================
! Access Switch C – IT Department
! Device   : SW-C (Cisco Catalyst 2960)
! VLAN     : 30 (IT)
! Project  : VLAN Configuration and Management
! ============================================================

enable
configure terminal

hostname SW-C-IT
no ip domain-lookup
enable secret cisco123
service password-encryption

line console 0
 password cisco
 login
 logging synchronous
line vty 0 15
 password cisco
 login
 transport input ssh telnet

! ============================================================
! VLANs
! ============================================================
vlan 30
 name IT
vlan 40
 name MANAGEMENT
vlan 99
 name NATIVE
vlan 999
 name UNUSED_PORTS

! ============================================================
! VTP Client
! ============================================================
vtp mode client
vtp domain COMPANY-NET
vtp password vtp_secret_2025
vtp version 2

! ============================================================
! Management SVI
! ============================================================
interface vlan 40
 description Management-Access
 ip address 192.168.0.12 255.255.255.0
 no shutdown

ip default-gateway 192.168.0.1

! ============================================================
! Trunk Uplink
! ============================================================
interface GigabitEthernet0/1
 description Trunk-to-Core-SW
 switchport mode trunk
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 30,40,99
 switchport nonegotiate
 no shutdown

! ============================================================
! IT Workstations (Fa0/1–Fa0/8)
!   IT staff are trusted; allow 2 MACs for VMs/dual NICs
! ============================================================
interface range FastEthernet0/1 - 8
 description IT-Workstation
 switchport mode access
 switchport access vlan 30
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 2
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 no shutdown

! ============================================================
! IT Lab / Testing Ports (Fa0/9–Fa0/16)
!   Higher MAC limit for test environments
! ============================================================
interface range FastEthernet0/9 - 16
 description IT-Lab-Port
 switchport mode access
 switchport access vlan 30
 switchport nonegotiate
 spanning-tree portfast
 switchport port-security
 switchport port-security maximum 5
 switchport port-security mac-address sticky
 switchport port-security violation protect
 no shutdown

! ============================================================
! Unused Ports
! ============================================================
interface range FastEthernet0/17 - 24
 description UNUSED-DISABLED
 switchport mode access
 switchport access vlan 999
 shutdown

spanning-tree mode rapid-pvst
spanning-tree vlan 30 priority 8192

end
write memory
